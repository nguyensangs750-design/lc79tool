<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC79 CLUB - Hệ Thống Quản Lý</title>
    <!-- Thêm thư viện Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #218838; }
        .admin-panel { margin-top: 30px; border-top: 2px solid #ddd; padding-top: 20px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background-color: #007bff; color: white; }
        .error { color: red; font-size: 14px; margin-top: 5px; text-align: center; }
        .success { color: green; font-size: 14px; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>LC79 CLUB - Đăng Ký / Đăng Nhập</h2>
    
    <div id="auth-section">
        <div class="form-group">
            <label>Tên tài khoản:</label>
            <input type="text" id="username" placeholder="Nhập tên tài khoản...">
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
        </div>
        <button onclick="handleLoginOrRegister()">Đăng Nhập / Đăng Ký</button>
        <div id="message"></div>
    </div>

    <!-- KHU VỰC ADMIN (Hiển thị toàn bộ server) -->
    <div id="admin-section" class="admin-panel">
        <h3 style="color: #dc3545; text-align: center;">👑 Bảng Quản Trị Admin (Toàn Server)</h3>
        <p>Danh sách tất cả tài khoản đã đăng ký trên mọi thiết bị:</p>
        <table>
            <thead>
                <tr>
                    <th>Tài khoản</th>
                    <th>Thiết bị (ID)</th>
                    <th>Thời gian tạo</th>
                </tr>
            </thead>
            <tbody id="user-list-table">
                <!-- Dữ liệu realtime từ server sẽ đổ vào đây -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // --- CẤU HÌNH FIREBASE CỦA BẠN ---
    // (Hãy thay thông tin dự án Firebase miễn phí của bạn vào đây)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Khởi tạo Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Tạo mã định danh duy nhất cho thiết bị hiện tại (Device Fingerprint / Local ID)
    let deviceId = localStorage.getItem('lc79_device_id');
    if (!deviceId) {
        deviceId = 'device_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        localStorage.setItem('lc79_device_id', deviceId);
    }

    // Hàm xử lý Đăng nhập / Đăng ký kèm kiểm tra giới hạn 2 tài khoản/thiết bị
    function handleLoginOrRegister() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const msgDiv = document.getElementById('message');

        if (!username || !password) {
            msgDiv.className = "error";
            msgDiv.innerText = "Vui lòng nhập đầy đủ tài khoản và mật khẩu!";
            return;
        }

        const usersRef = db.ref('users');

        // Kiểm tra xem thiết bị này đã tạo bao nhiêu tài khoản trước đó
        usersRef.orderByChild('deviceId').equalTo(deviceId).once('value', (snapshot) => {
            let deviceAccountCount = 0;
            let existingUser = false;

            snapshot.forEach((childSnapshot) => {
                const userData = childSnapshot.val();
                deviceAccountCount++;
                if (userData.username === username) {
                    existingUser = true;
                }
            });

            // Nếu tài khoản đã tồn tại -> Cho phép đăng nhập
            if (existingUser) {
                msgDiv.className = "success";
                msgDiv.innerText = "Đăng nhập thành công!";
                checkAdminAccess(username);
                return;
            }

            // Nếu tài khoản chưa tồn tại và thiết bị đã đạt giới hạn 2 tài khoản
            if (deviceAccountCount >= 2) {
                msgDiv.className = "error";
                msgDiv.innerText = "❌ Thiết bị này đã đạt giới hạn tối đa (2 tài khoản). Không thể tạo thêm!";
                return;
            }

            // Kiểm tra xem tên tài khoản đã bị người khác lấy chưa
            usersRef.orderByChild('username').equalTo(username).once('value', (userSnap) => {
                if (userSnap.exists()) {
                    msgDiv.className = "error";
                    msgDiv.innerText = "❌ Tên tài khoản này đã có người sử dụng!";
                } else {
                    // Tiến hành tạo tài khoản mới lên Server Realtime
                    const newUserData = {
                        username: username,
                        password: password,
                        deviceId: deviceId,
                        createdAt: new Date().toLocaleString()
                    };

                    usersRef.push(newUserData).then(() => {
                        msgDiv.className = "success";
                        msgDiv.innerText = "Đăng ký thành công tài khoản mới!";
                        checkAdminAccess(username);
                    });
                }
            });
        });
    }

    // Kiểm tra quyền Admin (Ví dụ: nếu tài khoản là 'admin' sẽ mở bảng quản trị toàn server)
    function checkAdminAccess(username) {
        if (username.toLowerCase() === 'admin') {
            document.getElementById('admin-section').style.display = 'block';
            loadAdminData();
        } else {
            document.getElementById('admin-section').style.display = 'none';
        }
    }

    // Lắng nghe dữ liệu Realtime toàn server cho trang Admin
    function loadAdminData() {
        const usersRef = db.ref('users');
        usersRef.on('value', (snapshot) => {
            const tableBody = document.getElementById('user-list-table');
            tableBody.innerHTML = '';

            snapshot.forEach((childSnapshot) => {
                const data = childSnapshot.val();
                const row = `<tr>
                    <td>${data.username}</td>
                    <td style="font-size:11px; color:#666;">${data.deviceId}</td>
                    <td>${data.createdAt}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        });
    }
</script>

</body>
</html>
